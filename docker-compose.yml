version: '3.8'

services:

  # --- SERVIÇO DE ENTRADA (O "PORTEIRO") ---
  # ✅ ÚNICO PONTO DE ACESSO PÚBLICO
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway-service
    ports:
      - "8080:8080" # <-- A única porta aberta para o Windows/Navegador
    volumes:
      - ./api-gateway:/usr/src/app
      - /usr/src/app/node_modules
    env_file:
      - .env
    environment:
      # O Gateway chama os serviços internos pelos NOMES DE HOST do Docker
      - BACKEND_URL=http://frag-api:8000
      - JWT_SECRET=7f8e9d1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9
      - JWT_EXPIRATION=3600s
      - LOG_URL=http://log-api:3000
    depends_on:
      db:
        condition: service_healthy
      frag-api:
        condition: service_started
      log-api:
        condition: service_started
    command: npm run start:dev
    restart: unless-stopped
    networks:
      - frag-net

  # --- SERVIÇOS DE API (BLINDADOS) ---

  frag-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: frag-api-service
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - JWT_SECRET=7f8e9d1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    networks:
      - frag-net

  worker:
    build:
      context: ./backend
    container_name: celery-worker
    command: celery -A app.tasks.celery_app worker --loglevel=info
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      redis:
        condition: service_started
      frag-api:
        condition: service_started
    restart: unless-stopped
    networks:
      - frag-net

  log-api:
    build:
      context: ./log
      dockerfile: Dockerfile
    container_name: log-api-service
    # 🔒 PORTAS REMOVIDAS: Acesso apenas via Gateway
    volumes:
      - ./log:/usr/src/app
      - /usr/src/app/node_modules
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    command: npm run start:dev
    restart: unless-stopped
    networks:
      - frag-net

  # --- SERVIÇOS DE INFRA ---

  db:
    image: postgres:15-alpine
    container_name: postgres-db
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432" # Mantido para você acessar via DBeaver/PgAdmin
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - frag-net

  redis:
    image: redis:7-alpine
    container_name: redis-broker
    ports:
      - "6379:6379" # Mantido para debug local
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - frag-net

# --- REDE E VOLUMES ---

networks:
  frag-net:
    driver: bridge

volumes:
  postgres_data: